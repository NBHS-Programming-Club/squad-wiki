site_name: Programming Squad Wiki
site_description: Project-based technical knowledge base for the Programming Squad.
site_url: https://<your-org-or-username>.github.io/<repository-name>/
repo_url: https://github.com/<your-org-or-username>/<repository-name>
repo_name: <your-org-or-username>/<repository-name>

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Setting Up Your Environment: getting-started/setting-up-your-environment.md
      - Using Git and GitHub: getting-started/using-git-and-github.md
  - Learning Pathways:
      - AI & Machine Learning: pathways/ai-machine-learning.md
      - Web Development: pathways/web-development.md
      - Robotics & Embedded Systems: pathways/robotics-embedded-systems.md
      - Game Development & Simulation: pathways/game-development-simulation.md
  - Projects:
      - Project Catalogue: projects/project-catalogue.md
      - Project Proposal Template: projects/templates/project-proposal-template.md
      - Project Documentation Template: projects/templates/project-documentation-template.md
  - Squad Handbook:
      - Workflow and Collaboration: handbook/squad-workflow.md
